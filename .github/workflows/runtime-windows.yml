name: Nexium Runtime Windows CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        name: Checkout
      - name: Configure x64
        run: cmake -S . -B build -A x64 -DNEXIUM_RUNTIME_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexium-runtime-windows-x64
          path: |
            build/Release/nexium_runtime.lib
            build/Release/nexium_runtime_tests.exe
          if-no-files-found: error
