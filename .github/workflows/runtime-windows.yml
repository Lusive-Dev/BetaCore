name: Nexium Runtime Windows CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure x64
        run: cmake -S . -B build -A x64 -DNEXIUM_RUNTIME_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Upload runtime artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexium-runtime-${{ matrix.runner }}-x64
          path: |
            build/Release/nexium_runtime.lib
            build/Release/nexium_runtime_tests.exe
          if-no-files-found: error
