name: Android APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android Gradle project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          wrapper="$(find . -maxdepth 6 -type f -name gradlew -not -path './.git/*' -print -quit)"
          if [ -z "$wrapper" ]; then
            echo "::error::No Gradle wrapper (gradlew) found. Upload/extract the Android Studio project, including gradlew and gradle/wrapper files, then push again."
            exit 1
          fi
          project_dir="$(dirname "$wrapper")"
          echo "dir=$project_dir" >> "$GITHUB_OUTPUT"
          chmod +x "$wrapper"
          echo "Using Android project at: $project_dir"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BetaCore-debug-apk
          path: |
            ${{ steps.project.outputs.dir }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
